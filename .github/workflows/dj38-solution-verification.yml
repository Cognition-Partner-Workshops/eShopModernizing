name: DJ-38 Solution Verification

on:
  pull_request:
    branches: [main]

jobs:
  build-solution:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore solution
        run: nuget restore eShopLegacyMVCSolution/eShopLegacyMVC.sln

      - name: Build solution with MSBuild
        run: msbuild eShopLegacyMVCSolution/eShopLegacyMVC.sln /p:Configuration=Release /nologo /verbosity:minimal

      - name: Run MSTest project
        run: dotnet test eShopLegacyMVCSolution/tests/eShopLegacyMVC.Tests/eShopLegacyMVC.Tests.csproj --configuration Release --no-restore
