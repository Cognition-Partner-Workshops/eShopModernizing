name: DJ-38 UI Verification

on:
  pull_request:
    branches: [main]

jobs:
  verify-ui:
    runs-on: windows-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          path: after

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: before

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore and build baseline and feature app
        shell: pwsh
        run: |
          nuget restore before/eShopLegacyMVCSolution/eShopLegacyMVC.sln
          msbuild before/eShopLegacyMVCSolution/src/eShopLegacyMVC/eShopLegacyMVC.csproj /p:Configuration=Release /nologo /verbosity:minimal
          nuget restore after/eShopLegacyMVCSolution/eShopLegacyMVC.sln
          msbuild after/eShopLegacyMVCSolution/src/eShopLegacyMVC/eShopLegacyMVC.csproj /p:Configuration=Release /nologo /verbosity:minimal

      - name: Enable mock data
        shell: pwsh
        run: |
          $configs = @(
            "before/eShopLegacyMVCSolution/src/eShopLegacyMVC/Web.config",
            "after/eShopLegacyMVCSolution/src/eShopLegacyMVC/Web.config"
          )
          foreach ($config in $configs) {
            (Get-Content $config) `
              -replace '<add key="UseMockData" value="false" />', '<add key="UseMockData" value="true" />' |
              Set-Content $config -Encoding UTF8
          }

      - name: Install browser automation
        shell: pwsh
        run: |
          npm install playwright@1.55.0 --no-save

      - name: Capture baseline under IIS Express
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $iisExpress = @(
            "${env:ProgramFiles}\IIS Express\iisexpress.exe",
            "${env:ProgramFiles(x86)}\IIS Express\iisexpress.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iisExpress) {
            throw "IIS Express was not found"
          }

          $beforePath = (Resolve-Path "before/eShopLegacyMVCSolution/src/eShopLegacyMVC").Path
          $process = Start-Process $iisExpress `
            -ArgumentList "/path:`"$beforePath`"", "/port:5101", "/trace:error" `
            -RedirectStandardOutput "artifacts/iis-before.log" `
            -RedirectStandardError "artifacts/iis-before-error.log" `
            -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Get-NetTCPConnection -LocalPort 5101 -State Listen -ErrorAction SilentlyContinue) {
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not (Get-NetTCPConnection -LocalPort 5101 -State Listen -ErrorAction SilentlyContinue)) {
              Get-Content artifacts/iis-before.log -ErrorAction SilentlyContinue
              Get-Content artifacts/iis-before-error.log -ErrorAction SilentlyContinue
              throw "Baseline IIS Express site did not listen on port 5101"
            }
            $env:VERIFICATION_MODE = "before"
            $env:BASE_URL = "http://localhost:5101"
            node after/.github/scripts/dj38-ui-verification.js
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process iisexpress -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Verify feature under IIS Express
        shell: pwsh
        run: |
          $iisExpress = @(
            "${env:ProgramFiles}\IIS Express\iisexpress.exe",
            "${env:ProgramFiles(x86)}\IIS Express\iisexpress.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $afterPath = (Resolve-Path "after/eShopLegacyMVCSolution/src/eShopLegacyMVC").Path
          $process = Start-Process $iisExpress `
            -ArgumentList "/path:`"$afterPath`"", "/port:5102", "/trace:error" `
            -RedirectStandardOutput "artifacts/iis-after.log" `
            -RedirectStandardError "artifacts/iis-after-error.log" `
            -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Get-NetTCPConnection -LocalPort 5102 -State Listen -ErrorAction SilentlyContinue) {
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not (Get-NetTCPConnection -LocalPort 5102 -State Listen -ErrorAction SilentlyContinue)) {
              Get-Content artifacts/iis-after.log -ErrorAction SilentlyContinue
              Get-Content artifacts/iis-after-error.log -ErrorAction SilentlyContinue
              throw "Feature IIS Express site did not listen on port 5102"
            }
            $env:VERIFICATION_MODE = "after"
            $env:BASE_URL = "http://localhost:5102"
            node after/.github/scripts/dj38-ui-verification.js
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process iisexpress -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dj38-ui-verification
          path: artifacts
