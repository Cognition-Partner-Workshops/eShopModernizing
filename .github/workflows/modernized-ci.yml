name: Modernized CI

on:
  push:
    branches: [main, 'modernization/**']
  pull_request:
    branches: [main, 'modernization/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build modernized/eShopModernized.sln -c Release

      - name: Test
        run: dotnet test modernized/eShopModernized.sln -c Release
