name: CI

on:
  push:
    branches: [main, devin/net-modernization-integration]
  pull_request:
    branches: [main, devin/net-modernization-integration]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  ESHOP_TAG: ci

jobs:
  # ---------------------------------------------------------------------------------------------
  # Primary pipeline: the modernized .NET 8 solution on Linux.
  # ---------------------------------------------------------------------------------------------
  build-test:
    name: Build and test (eShop.sln)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore eShop.sln

      - name: Build (Release)
        run: dotnet build eShop.sln --configuration Release --no-restore

      - name: Test (Release)
        run: |
          dotnet test eShop.sln --configuration Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory artifacts/test-results \
            --collect:"XPlat Code Coverage"

      - name: Banned-serializer gate (BinaryFormatter)
        run: scripts/check-no-binaryformatter.sh

      - name: Vulnerable package report (advisory)
        if: always()
        run: |
          mkdir -p artifacts/reports
          dotnet list eShop.sln package --vulnerable --include-transitive \
            | tee artifacts/reports/vulnerable-packages.txt

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Container images for the three hosts (NET-71). The images are exported so the smoke test job
  # runs exactly the artifacts this job produced instead of rebuilding them.
  # ---------------------------------------------------------------------------------------------
  docker-build:
    name: Build container images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build web api grpc
        env:
          # Interpolated by docker-compose.yml but unused: no SQL Server container is started here.
          MSSQL_SA_PASSWORD: unused-at-build-time

      - name: Export images
        run: |
          mkdir -p artifacts/images
          docker save \
            "eshop/web:${ESHOP_TAG}" \
            "eshop/catalog-api:${ESHOP_TAG}" \
            "eshop/catalog-grpc:${ESHOP_TAG}" \
            | gzip > artifacts/images/eshop-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: artifacts/images/eshop-images.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Compose smoke test: a broken container fails CI here rather than in a downstream parity run.
  # ---------------------------------------------------------------------------------------------
  compose-smoke:
    name: Compose smoke test (mock data)
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: container-images
          path: artifacts/images

      - name: Load images
        run: docker load --input artifacts/images/eshop-images.tar.gz

      - name: Install grpcurl
        run: |
          version=1.9.1
          curl --fail --silent --location \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${version}/grpcurl_${version}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Smoke test the stack
        run: scripts/compose-smoke.sh
        env:
          # The images were built by the docker-build job and loaded above.
          COMPOSE_BUILD: '0'

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml logs --no-color
        env:
          MSSQL_SA_PASSWORD: unused-in-mock-mode

  # ---------------------------------------------------------------------------------------------
  # Publishable artifacts for the three Linux hosts. Image publishing to a registry is documented
  # in modernization/ci-cd.md; this repository has no registry configured, so nothing is pushed.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: Publish hosts
    runs-on: ubuntu-latest
    needs: build-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eShop.Web
            project: src/eShop.Web/eShop.Web.csproj
          - name: eShop.Catalog.Api
            project: src/eShop.Catalog.Api/eShop.Catalog.Api.csproj
          - name: eShop.Catalog.Grpc
            project: src/eShop.Catalog.Grpc/eShop.Catalog.Grpc.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish ${{ matrix.name }}
        run: dotnet publish ${{ matrix.project }} --configuration Release --output publish/${{ matrix.name }}

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-linux
          path: publish/${{ matrix.name }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Windows-only jobs. The WinForms client is a Windows desktop application (NET-68) and the legacy
  # MVC solution is .NET Framework 4.7.2 + MSBuild; both genuinely require a Windows agent.
  # ---------------------------------------------------------------------------------------------
  winforms-client:
    name: Publish WinForms client (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained WinForms client
        run: dotnet publish src/eShop.WinForms.Client/eShop.WinForms.Client.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSelfContained=true --output publish/winforms-client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eShop.WinForms.Client-win-x64
          path: publish/winforms-client

  legacy-mvc:
    name: Legacy MVC 5 (Windows, .NET Framework)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages (Legacy MVC)
        run: nuget restore eShopLegacyMVCSolution/eShopLegacyMVC.sln

      - name: Build Legacy MVC
        run: msbuild eShopLegacyMVCSolution/src/eShopLegacyMVC/eShopLegacyMVC.csproj /p:Configuration=Release /nologo /verbosity:minimal

      - name: Build Utilities
        run: msbuild eShopLegacyMVCSolution/eShopLegacy.Utilities/eShopLegacy.Utilities.csproj /p:Configuration=Release /nologo /verbosity:minimal

      - name: Restore and build tests
        run: dotnet build eShopLegacyMVCSolution/tests/eShopLegacyMVC.Tests/eShopLegacyMVC.Tests.csproj --configuration Release

      - name: Run tests
        run: dotnet test eShopLegacyMVCSolution/tests/eShopLegacyMVC.Tests/eShopLegacyMVC.Tests.csproj --configuration Release --no-build --verbosity normal
