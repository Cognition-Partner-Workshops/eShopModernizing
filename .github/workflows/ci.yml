name: CI

on:
  push:
    branches: [main, devin/net-modernization-integration]
  pull_request:
    branches: [main, devin/net-modernization-integration]

jobs:
  modernized:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore eShop.sln

      - name: Build
        run: dotnet build eShop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test eShop.sln --configuration Release --no-build --verbosity normal

      - name: BinaryFormatter gate
        run: |
          if [ -x scripts/check-no-binaryformatter.sh ]; then
            scripts/check-no-binaryformatter.sh
          fi

  winforms-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained WinForms client
        run: dotnet publish src/eShop.WinForms.Client/eShop.WinForms.Client.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSelfContained=true --output publish/winforms-client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eShop.WinForms.Client-win-x64
          path: publish/winforms-client

  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages (Legacy MVC)
        run: nuget restore eShopLegacyMVCSolution/eShopLegacyMVC.sln

      - name: Build Legacy MVC
        run: msbuild eShopLegacyMVCSolution/src/eShopLegacyMVC/eShopLegacyMVC.csproj /p:Configuration=Release /nologo /verbosity:minimal

      - name: Build Utilities
        run: msbuild eShopLegacyMVCSolution/eShopLegacy.Utilities/eShopLegacy.Utilities.csproj /p:Configuration=Release /nologo /verbosity:minimal

      - name: Restore and build tests
        run: dotnet build eShopLegacyMVCSolution/tests/eShopLegacyMVC.Tests/eShopLegacyMVC.Tests.csproj --configuration Release

      - name: Run tests
        run: dotnet test eShopLegacyMVCSolution/tests/eShopLegacyMVC.Tests/eShopLegacyMVC.Tests.csproj --configuration Release --no-build --verbosity normal
